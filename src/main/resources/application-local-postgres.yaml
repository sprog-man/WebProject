spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webporduce}
    username: ${DB_USERNAME:webporduce}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  compression:
    enabled: true

app:
  storage:
    root: ${APP_STORAGE_ROOT:./data/uploads}

logging:
  level:
    com.xiaoliu.webporduce: info
