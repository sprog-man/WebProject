services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webporduce
      POSTGRES_USER: webporduce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webporduce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webporduce -d webporduce"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/webporduce
      DB_USERNAME: webporduce
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webporduce}
      APP_STORAGE_ROOT: /app/uploads
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - uploads:/app/uploads

volumes:
  postgres_data:
  uploads:
