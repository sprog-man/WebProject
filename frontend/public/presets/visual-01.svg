<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="48%" cy="42%" r="80%">
      <stop offset="0" stop-color="#2b1a18"/>
      <stop offset="55%" stop-color="#17100f"/>
      <stop offset="1" stop-color="#0b0a0a"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffe2c8"/>
      <stop offset="22%" stop-color="#ffac74"/>
      <stop offset="52%" stop-color="#ef6338"/>
      <stop offset="78%" stop-color="#9c2c24"/>
      <stop offset="100%" stop-color="#4b1217"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7b45" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7b45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd8bc" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#ff9a63" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffd8bc" stop-opacity=".55"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".13"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <ellipse cx="640" cy="700" rx="400" ry="380" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="600" cy="690" r="292" fill="url(#orb)"/>
  <ellipse cx="500" cy="550" rx="115" ry="76" fill="#ffe6cf" opacity=".24" filter="url(#soft)"/>
  <path d="M110 1080C260 900 420 1030 610 900c190-130 300-30 490-150" fill="none" stroke="url(#ring)" stroke-width="1.4" opacity=".8"/>
  <path d="M-40 1190C190 940 360 1130 600 970c240-160 350-10 650-220" fill="none" stroke="url(#ring)" stroke-width="1" opacity=".35"/>
  <circle cx="600" cy="690" r="382" fill="none" stroke="#ffd8bc" stroke-opacity=".13"/>
  <circle cx="600" cy="690" r="438" fill="none" stroke="#ffd8bc" stroke-opacity=".07"/>
  <g opacity=".8">
    <circle cx="228" cy="306" r="3" fill="#ffd0ae"/>
    <circle cx="972" cy="438" r="2" fill="#ffd0ae"/>
    <circle cx="904" cy="1120" r="2.5" fill="#ffd0ae"/>
    <circle cx="332" cy="1214" r="2" fill="#ffd0ae"/>
  </g>
  <rect width="1200" height="1500" filter="url(#grain)" opacity=".55"/>
</svg>
