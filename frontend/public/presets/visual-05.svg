<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e7d5"/>
      <stop offset="1" stop-color="#d7c8ad"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".6" stop-color="#ffd27d"/>
      <stop offset="1" stop-color="#ed9b47"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1a15"/>
      <stop offset="1" stop-color="#332c22"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <g stroke="#2c261d" stroke-opacity=".13">
    <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200M0 750h1200M0 900h1200M0 1050h1200M0 1200h1200M0 1350h1200"/>
    <path d="M150 0v1500M300 0v1500M450 0v1500M600 0v1500M750 0v1500M900 0v1500M1050 0v1500"/>
  </g>
  <circle cx="780" cy="470" r="210" fill="url(#sun)" opacity=".95"/>
  <circle cx="780" cy="470" r="280" fill="none" stroke="#2c261d" stroke-opacity=".22"/>
  <circle cx="780" cy="470" r="350" fill="none" stroke="#2c261d" stroke-opacity=".1"/>
  <rect x="86" y="880" width="500" height="380" rx="8" fill="url(#panel)" transform="rotate(-4 86 880)"/>
  <rect x="128" y="924" width="416" height="292" rx="4" fill="none" stroke="#f5ead4" stroke-opacity=".28" stroke-width="1" transform="rotate(-4 86 880)"/>
  <text x="160" y="1030" fill="#f5ead4" font-family="Georgia, serif" font-size="46" opacity=".9" transform="rotate(-4 86 880)">LIGHT</text>
  <text x="160" y="1090" fill="#f5ead4" font-family="Georgia, serif" font-size="46" opacity=".55" transform="rotate(-4 86 880)">STUDY / 05</text>
  <path d="M780 1120c0-120 90-210 200-210s200 90 200 210" fill="none" stroke="#2c261d" stroke-opacity=".28" stroke-width="1.2"/>
  <path d="M780 1180c0-150 90-260 200-260s200 110 200 260" fill="none" stroke="#2c261d" stroke-opacity=".12" stroke-width="1"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity=".6"/>
</svg>
